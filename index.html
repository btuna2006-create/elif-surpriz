<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elif’e Özel ❤️</title>
<style>
body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 background:linear-gradient(135deg,#ff9a9e,#fad0c4);
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
}
.card{
 background:rgba(255,255,255,.95);
 border-radius:20px;
 padding:25px;
 width:90%;
 max-width:360px;
 text-align:center;
 box-shadow:0 10px 30px rgba(0,0,0,.25);
}
h1{color:#e63946}
p{color:#444;font-size:16px;line-height:1.6}
button{
 background:#e63946;
 color:#fff;
 border:none;
 padding:12px 20px;
 border-radius:25px;
 font-size:15px;
 margin-top:10px;
 cursor:pointer;
}
#msg{display:none;color:#e63946;font-size:17px;margin-top:15px}
.heart{
 position:absolute;
 color:#e63946;
 font-size:18px;
 animation:float 6s linear infinite;
 opacity:.7;
}
@keyframes float{
 from{transform:translateY(100vh)}
 to{transform:translateY(-10vh)}
}
</style>
</head>
<body>

<div class="card">
 <h1>💖 Elif 💖</h1>
 <p>Liselim bizim şarkımız…<br>Bu sayfa sadece sana.</p>

 <button onclick="document.getElementById('music').play()">Müziği Başlat 🎶</button>
 <button onclick="document.getElementById('msg').style.display='block'">Sürprizi Gör 💝</button>

 <div id="msg">Seni çok seviyorum Elif ❤️<br>İyi ki varsın…</div>
</div>

<audio id="music">
 <source src="MP3_LINK_BURAYA" type="audio/mpeg">
</audio>

<script>
setInterval(()=>{
 const h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},500);
</script>

</body>
</html>
