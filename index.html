<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elif’e Özel ❤️</title>

  <style>
    body{
      margin:0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:#fff;
    }

    .card{
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding:30px 20px;
      border-radius:20px;
      max-width:320px;
      width:90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1{
      margin-top:0;
      font-size:26px;
    }

    p{
      font-size:16px;
      line-height:1.5;
    }

    .spotify-btn{
      margin-top:25px;
      background:#1DB954;
      color:white;
      border:none;
      padding:14px 24px;
      border-radius:30px;
      font-size:16px;
      cursor:pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }

    .spotify-btn:hover{
      transform: scale(1.05);
    }

    .footer{
      margin-top:20px;
      font-size:13px;
      opacity:0.9;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Elif ❤️</h1>

    <p>
      Bazı şarkılar vardır…<br>
      Duyunca aklına tek bir kişi gelir.<br><br>
      Bu da bizim şarkımız 🎶
    </p>

    <a href="https://open.spotify.com/track/1Z0QPFfFcXlykaIt8PpCmu?si=cg_KeYClSVWhugNfgo4kig" target="_blank">
      <button class="spotify-btn">
        🎧 Spotify’da Dinle
      </button>
    </a>

    <div class="footer">
      Cengiz Kurtoğlu – Liselim
    </div>
  </div>

</body>
</html>
